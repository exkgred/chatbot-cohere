<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot do Portfólio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <div id="chat-box">
      <div class="message bot">Olá! Sou o assistente do portfólio de Joshua Silva, Engenheiro de Software. Pergunte sobre experiências, habilidades, formação ou contato! 😊</div>
    </div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Digite sua pergunta...">
      <button id="send-btn">Enviar</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
